name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Check server starts (smoke test)
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 2
          curl --fail http://localhost:4000/api/health
          kill $SERVER_PID
